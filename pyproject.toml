[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xinrefinement"
dynamic = ["version"]
description = "通用粉末衍射全谱拟合（Rietveld 结构精修 / 谱图精修）桌面软件"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "matplotlib==3.10.9",
    "PySide6==6.11.2",
    "spglib>=2.5",
]

[project.scripts]
xinrefinement = "xinrefinement.cli.refine:main"

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xinrefinement*"]

[tool.setuptools.dynamic]
version = {attr = "xinrefinement.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
